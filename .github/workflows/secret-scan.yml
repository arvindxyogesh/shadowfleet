name: secret scan

# NFR-10: no secrets (API keys, DB credentials) committed to the
# repository. Scans the full git history, not just the diff, so a secret
# committed and then deleted in a later commit still fails the build --
# it's still in history and still needs rotating. No path filter: a
# secret can land in any file.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Pinned release, verified against its published checksum before use.
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan git history
        run: gitleaks git . --redact --verbose --no-banner
