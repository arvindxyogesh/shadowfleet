name: control_plane CI

on:
  push:
    branches: ["**"]
    paths:
      - "control_plane/**"
      - "pytest.ini"
      - ".github/workflows/control-plane-ci.yml"
  pull_request:
    paths:
      - "control_plane/**"
      - "pytest.ini"
      - ".github/workflows/control-plane-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: control_plane/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r control_plane/requirements-dev.txt

      - name: Run tests
        run: pytest control_plane/tests -v
